<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Worker Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
    padding:20px;
}

h1{
    text-align:center;
    color:#2e7d32;
    margin-bottom:20px;
}

.table-container{
    background:#fff;
    border-radius:10px;
    overflow-x:auto;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

table{
    width:100%;
    min-width: 700px;
    border-collapse:collapse;
}

th{
    background:#2e7d32;
    color:white;
    padding:6px;
    font-size:12px;
}

td{
    padding:5px;
    text-align:center;
    border-bottom:1px solid #ddd;
    font-size:11px;
}

button{
    padding:4px 6px;
    font-size:10px;
    border:none;
    border-radius:4px;
    color:white;
    cursor:pointer;
}

.approve{
    background:#28a745;
}

.reject{
    background:#dc3545;
}
</style>
</head>

<body>

<h1>Workers Dashboard</h1>

<div class="table-container">

<table>

<thead>

<tr>
<th>Name</th>
<th>Age</th>
<th>Task</th>
<th>S</th>
<th>✓</th>
<th>✗</th>
</tr>

</thead>

<tbody id="workersTable">

</tbody>

</table>

</div>

<script>

const { createClient } = supabase;

const supabaseClient = createClient(
    "https://mqiaibdurohbulekeyeh.supabase.co",
    "sb_publishable_xxHQrwhHRVO2zPv95BRdXQ_gF0_qVJQ"
);

async function loadWorkers() {

    const { data, error } = await supabaseClient
        .from("submissions")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        console.error(error);
        return;
    }

    const table = document.getElementById("workersTable");
    table.innerHTML = "";

    data.forEach(worker => {

        table.innerHTML += `
        <tr>
            <td>${worker.name}</td>
            <td>${worker.age}</td>
            <td>${worker.task ?? ""}</td>
            <td>${
    worker.status === "Pending" ? "P" :
    worker.status === "Approved" ? "A" :
    worker.status === "Rejected" ? "R" : ""
}</td>

            <td>
                <button
                    class="approve"
                    onclick="approveWorker(${worker.id})">
                    Approve
                </button>
            </td>

            <td>
                <button
                    class="reject"
                    onclick="rejectWorker(${worker.id})">
                    Reject
                </button>
            </td>
        </tr>`;
    });

}

loadWorkers();

supabaseClient
.channel("workers-live")
.on(
    "postgres_changes",
    {
        event: "*",
        schema: "public",
        table: "submissions"
    },
    () => {

        loadWorkers();

    }
)
.subscribe();
async function approveWorker(id){

    const { error } = await supabaseClient
        .from("submissions")
        .update({
            status: "Approved"
        })
        .eq("id", id);

    if(error){
        alert(error.message);
        console.error(error);
    }
loadWorkers();
}

async function rejectWorker(id){

    const { error } = await supabaseClient
        .from("submissions")
        .update({
            status: "Rejected",
            task: ""
        })
        .eq("id", id);

    if(error){
        alert(error.message);
        console.error(error);
    }
loadWorkers();
}

</script>

</body>
</html>
